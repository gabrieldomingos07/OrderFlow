name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OrderFlow.slnx

      - name: Build
        run: dotnet build OrderFlow.slnx --configuration Release --no-restore

      # Advisories are warnings locally (so a new CVE never breaks a visitor's build); here they fail CI.
      - name: Check for vulnerable packages
        run: |
          dotnet list OrderFlow.slnx package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then exit 1; fi

      # Integration tests start PostgreSQL with Testcontainers, using the runner's Docker engine.
      - name: Test
        run: >
          dotnet test --solution OrderFlow.slnx
          --configuration Release
          --no-build
          --report-trx
          --coverage
          --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: orderflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
