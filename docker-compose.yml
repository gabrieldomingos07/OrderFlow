# Local demo environment: `docker compose up --build`, then open http://localhost:8080/scalar
# Credentials below are for local development only.
name: orderflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U orderflow -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=orderflow;Username=orderflow;Password=orderflow
    ports:
      - "8080:8080"

volumes:
  postgres-data:
